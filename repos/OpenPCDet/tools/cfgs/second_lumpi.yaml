# v5: SECOND, trained on lumpi_v1; 50-epoch schedule, epoch 38 released (v5_second_epoch38.pth)
# Reconstructed 2026-11 (original file lost with the training machine).
# Architecture/geometry verified: released checkpoint loads with strict=True.
# Schedule (adam_onecycle, LR 0.003, batch 4, epochs) recovered from checkpoint optimizer state.
# Anchors from config/real_anchors.json (synth = real / config/rescale_ratios.json).
# Assumed upstream defaults (not recoverable): WEIGHT_DECAY, DATA_AUGMENTOR.
# OpenPCDet 233f849 (pcdet+0.6.0+233f849).
CLASS_NAMES:
- Person
- Car
- Bicycle
- Motorcycle
- Bus
- Truck
- Van
- Unknown
DATA_CONFIG:
  _BASE_CONFIG_: cfgs/dataset_configs/custom_dataset.yaml
  POINT_CLOUD_RANGE:
  - -51.2
  - -51.2
  - -4
  - 51.2
  - 51.2
  - 6.0
  POINT_FEATURE_ENCODING:
    encoding_type: absolute_coordinates_encoding
    used_feature_list:
    - x
    - y
    - z
    src_feature_list:
    - x
    - y
    - z
  DATA_PROCESSOR:
  - NAME: mask_points_and_boxes_outside_range
    REMOVE_OUTSIDE_BOXES: true
  - NAME: shuffle_points
    SHUFFLE_ENABLED:
      train: true
      test: false
  - NAME: transform_points_to_voxels
    VOXEL_SIZE:
    - 0.16
    - 0.16
    - 0.2
    MAX_POINTS_PER_VOXEL: 5
    MAX_NUMBER_OF_VOXELS:
      train: 150000
      test: 150000
  DATA_PATH: ../data/lumpi_v1
  MAP_CLASS_TO_KITTI:
    Person: Pedestrian
    Car: Car
    Bicycle: Cyclist
    Motorcycle: Cyclist
    Bus: Car
    Truck: Car
    Van: Car
    Unknown: Car
  DATA_AUGMENTOR:
    DISABLE_AUG_LIST:
    - placeholder
    AUG_CONFIG_LIST:
    - NAME: random_world_flip
      ALONG_AXIS_LIST:
      - x
      - y
    - NAME: random_world_rotation
      WORLD_ROT_ANGLE:
      - -0.78539816
      - 0.78539816
    - NAME: random_world_scaling
      WORLD_SCALE_RANGE:
      - 0.95
      - 1.05
MODEL:
  NAME: SECONDNet
  VFE:
    NAME: MeanVFE
  BACKBONE_3D:
    NAME: VoxelBackBone8x
  MAP_TO_BEV:
    NAME: HeightCompression
    NUM_BEV_FEATURES: 256
  BACKBONE_2D:
    NAME: BaseBEVBackbone
    LAYER_NUMS:
    - 5
    - 5
    LAYER_STRIDES:
    - 1
    - 2
    NUM_FILTERS:
    - 128
    - 256
    UPSAMPLE_STRIDES:
    - 1
    - 2
    NUM_UPSAMPLE_FILTERS:
    - 256
    - 256
  DENSE_HEAD:
    NAME: AnchorHeadSingle
    CLASS_AGNOSTIC: false
    USE_DIRECTION_CLASSIFIER: true
    DIR_OFFSET: 0.78539
    DIR_LIMIT_OFFSET: 0.0
    NUM_DIR_BINS: 2
    ANCHOR_GENERATOR_CONFIG:
    - class_name: Person
      anchor_sizes:
      - - 0.8
        - 0.7
        - 1.593
      anchor_rotations:
      - 0
      - 1.57
      anchor_bottom_heights:
      - -2.18
      align_center: false
      feature_map_stride: 8
      matched_threshold: 0.5
      unmatched_threshold: 0.35
    - class_name: Car
